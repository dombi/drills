<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Producer-pult · Unikornis Centum</title>
<!--
  Unikornis Centum — Producer-pult (backend 3–4. fázis)
  Olvas: users + unicorns + events. Ír (4. fázis): producerConfig (egyéni felülírások, megjegyzés, egyéni pályák) + groups (csoportok + csoport-pályák). Belépés: admin@unikornis.app (a producer saját jelszavával).
  Az admin-jogot a firestore.rules isAdmin() adja (e-mail alapján) — Cloud Function nélkül.
  FONTOS: külön Firebase-app ("pult") → a belépés NEM keveredik a játék belépésével ugyanabban a böngészőben.
-->
<style>
:root{
  --lila:#b79fd4; --lila-vil:#e9ddf3; --lila-sotet:#4a3b7a; --halvany:#8f7ab8;
  --rozsa:#f6a5c0; --menta:#a7d99a; --menta-mely:#4f9a4d; --sarga:#fce49a; --kek:#9ec9f0;
  --piros:#d9546e; --hatter:#f4eef8; --kartya:#ffffff; --keret:#e2d6ee; --szoveg:#3d3266;
}
*{ box-sizing:border-box; margin:0; padding:0; }
[hidden]{ display:none !important; }
body{ font-family:"Segoe UI",system-ui,sans-serif; background:var(--hatter); color:var(--szoveg); font-size:15px; line-height:1.45; }
button,select,input{ font:inherit; color:inherit; }
button{ cursor:pointer; border:none; border-radius:10px; padding:7px 14px; background:var(--lila-vil); color:var(--lila-sotet); font-weight:600; }
button:hover{ filter:brightness(.96); }
button.fo{ background:var(--lila-sotet); color:#fff; }
button.aktiv{ background:var(--lila-sotet); color:#fff; }
select,input{ border:1px solid var(--keret); border-radius:10px; padding:7px 10px; background:#fff; }
h2{ font-size:19px; margin:4px 0 12px; }
h3{ font-size:16px; margin:18px 0 8px; }
.halvany{ color:var(--halvany); }
.kicsi{ font-size:13px; }

/* belépés */
#belepes{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.belepo{ background:#fff; border-radius:20px; padding:28px; width:100%; max-width:360px; box-shadow:0 8px 30px rgba(74,59,122,.12); text-align:center; }
.belepo h1{ font-size:22px; margin:6px 0 4px; }
.belepo input{ width:100%; margin-top:10px; }
.belepo button{ width:100%; margin-top:14px; padding:10px; }
.hiba{ color:var(--piros); margin-top:10px; min-height:1.2em; font-size:14px; }

/* fejléc + fülek */
header{ background:#fff; border-bottom:1px solid var(--keret); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; z-index:5; }
header .cim{ font-weight:700; font-size:17px; margin-right:auto; }
nav{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px 0; max-width:1200px; margin:0 auto; }
main{ max-width:1200px; margin:0 auto; padding:14px 16px 40px; }
.eszkozsor{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }

/* kártyák */
.racs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.kartya{ background:var(--kartya); border:1px solid var(--keret); border-radius:16px; padding:14px 16px; }
.kartya.kattinthato{ cursor:pointer; }
.kartya.kattinthato:hover{ border-color:var(--lila); }
.kartya h3{ margin:0 0 6px; display:flex; align-items:center; gap:8px; }
.szamok{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:8px; }
.szamok b{ font-size:18px; display:block; }
.szamok span{ font-size:12px; color:var(--halvany); }
.pont{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.pont.most{ background:var(--menta-mely); box-shadow:0 0 0 3px rgba(79,154,77,.25); }
.pont.friss{ background:var(--menta); } .pont.regi{ background:var(--sarga); } .pont.nagyonregi{ background:var(--piros); }

/* figyelmeztetések */
.figy{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.figy div{ background:#fff7e0; border:1px solid #f1dd9c; border-radius:12px; padding:8px 12px; }
.figy div.piros{ background:#fdecef; border-color:#f3bcc7; }
.figy div.zold{ background:#eef8ec; border-color:#c6e6bf; }

/* táblázatok */
.tabla-keret{ overflow-x:auto; background:#fff; border:1px solid var(--keret); border-radius:14px; }
table{ border-collapse:collapse; width:100%; font-size:14px; }
th,td{ padding:7px 10px; text-align:left; border-bottom:1px solid #f0e8f6; white-space:nowrap; }
th{ background:#faf6fd; font-weight:600; color:var(--halvany); font-size:13px; position:sticky; top:0; }
td.szam, th.szam{ text-align:right; }
tr.rossz td{ background:#fdf1f3; }
td.tores{ white-space:normal; max-width:420px; }
.jo{ color:var(--menta-mely); font-weight:700; } .rossz-sz{ color:var(--piros); font-weight:700; }
.sav{ height:8px; background:#f0e8f6; border-radius:4px; overflow:hidden; min-width:60px; }
.sav i{ display:block; height:100%; background:var(--menta); }
.sav i.gyenge{ background:var(--piros); } .sav i.kozepes{ background:var(--sarga); }

/* naptár */
.naptar{ display:grid; grid-template-columns:repeat(7,26px); gap:4px; }
.naptar div{ width:26px; height:26px; border-radius:6px; background:#f0e8f6; font-size:10px; display:flex; align-items:center; justify-content:center; color:var(--halvany); }
.naptar div.jatszott{ background:var(--menta); color:#234; font-weight:700; }
.naptar div.ma{ outline:2px solid var(--lila-sotet); }
.naptar .fej{ background:none; font-weight:600; }
.ures{ padding:20px; text-align:center; color:var(--halvany); }

/* beállítások (4. fázis) */
.celsor{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
.celsor .cimke{ font-size:13px; color:var(--halvany); margin-right:4px; min-width:80px; }
td select{ padding:4px 6px; font-size:14px; }
td select.beallitva{ background:#fff3d6; border-color:#f1d08a; font-weight:600; }
.pipak{ display:inline-flex; flex-wrap:wrap; gap:1px 5px; padding:3px 6px; border:1px solid var(--keret); border-radius:10px; font-size:13px; min-width:205px; max-width:240px; }
.pipak input{ margin:0 1px 0 0; }
.pipak.beallitva{ background:#fff3d6; border-color:#f1d08a; font-weight:600; }
.pipak label{ display:inline-flex; align-items:center; gap:1px; white-space:nowrap; cursor:pointer; }
tr.kulcs td:first-child::after{ content:" 🔑"; }
.hatas{ font-size:13px; }
/* 🌈 Tüneménykert (5. fázis) */
.ksor{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:8px 0; }
.ksor label{ display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
.ksor input[type=time]{ padding:4px 6px; }
.kallapot{ margin-top:10px; padding:8px 12px; border-radius:12px; background:#eef8ec; border:1px solid #c6e6bf; font-size:14px; white-space:normal; }
.kallapot.zarva{ background:#fdecef; border-color:#f3bcc7; }
.bent-szoba{ margin:6px 0; } .bent-szoba b{ display:block; font-size:13px; color:var(--halvany); }
.bent-nev{ display:inline-block; margin:3px 4px 0 0; padding:3px 10px; border-radius:99px; background:#f3ecff; font-weight:600; }
td input.becenev{ width:150px; padding:4px 8px; }
.tagok{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:6px; }
textarea{ font:inherit; width:100%; min-height:70px; border:1px solid var(--keret); border-radius:10px; padding:8px 10px; resize:vertical; }
#mentve{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--lila-sotet); color:#fff; padding:8px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; }
#mentve.lathato{ opacity:1; }
#mentve.hiba{ background:var(--piros); }
/* egyéni pályák (4b) */
.urlap{ margin-bottom:16px; border-color:var(--lila); }
.usor{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:flex-start; margin:8px 0; }
.usor .cimke{ font-size:13px; color:var(--halvany); min-width:90px; padding-top:7px; }
.ikonok, .sablonok{ display:flex; flex-wrap:wrap; gap:5px; }
.ikonok button{ font-size:19px; padding:3px 8px; }
.pipak.fajtak{ max-width:none; width:min(560px,100%); display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); padding:6px 10px; }
.elonezet{ margin:2px 0 4px 20px; font-size:14px; }
</style>
</head>
<body>

<section id="belepes" hidden>
  <div class="belepo">
    <div style="font-size:40px">🦄📊</div>
    <h1>Producer-pult</h1>
    <p class="halvany kicsi">Unikornis Centum</p>
    <input id="b-email" type="email" autocomplete="username" value="admin@unikornis.app">
    <input id="b-jelszo" type="password" autocomplete="current-password" placeholder="Jelszó">
    <button id="b-gomb" class="fo">Belépés</button>
    <div id="b-hiba" class="hiba"></div>
  </div>
</section>

<section id="pult" hidden>
  <header>
    <span class="cim">🦄 Producer-pult</span>
    <label class="kicsi halvany">Időszak
      <select id="idoszak">
        <option value="1">ma</option>
        <option value="7" selected>7 nap</option>
        <option value="30">30 nap</option>
        <option value="90">90 nap</option>
      </select>
    </label>
    <button id="frissit" title="Játékos-adatok újratöltése">↻ Frissítés</button>
    <span id="ki-belepve" class="kicsi halvany"></span>
    <button id="kilep">Kilépés</button>
  </header>
  <nav id="fulek"></nav>
  <main id="tartalom"><div class="ures">Adatok betöltése…</div></main>
</section>
<div id="mentve"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(function () {
"use strict";

/* ugyanaz a projekt, mint a játékban (src/firebase-config.js) — a config nem titok, a védelmet a rules adja */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyD7O40iCaeSryo17HEOVcWKJ0263LY5-fw",
  authDomain: "unicornis-centum.firebaseapp.com",
  projectId: "unicornis-centum",
  storageBucket: "unicornis-centum.firebasestorage.app",
  messagingSenderId: "198411098733",
  appId: "1:198411098733:web:e55f82c3b71fe347123d64",
  databaseURL: "https://unicornis-centum-default-rtdb.europe-west1.firebasedatabase.app"
};
var NAP = 86400000;
var ESEMENY_NAPOK = 90;           /* ennyi napnyi eseményt töltünk be (a szűrés utána helyben megy) */
var ESEMENY_LIMIT = 5000;
var INAKTIV_NAP = 3;              /* ennyi nap szünet után figyelmeztet */
var GYENGE_ARANY = 0.6;           /* ez alatti elsőre-arány egy pályán = figyelmeztetés */

var LENY_NEV = { ragyogas: "Ragyogás", tuz: "Tűz", csillamharmat: "Csillámharmat" };
var LENY_IKON = { ragyogas: "🤍", tuz: "🔥", csillamharmat: "💧" };
var PALYA = {};                   /* id → { nev, ikon, sorrend } — a játék src/constants.js-éből olvassuk */
var PALYA_SORREND = [];

/* külön app-név: a belépés nem ütközik a játék [DEFAULT] belépésével ugyanabban a böngészőben */
var app = firebase.initializeApp(FIREBASE_CONFIG, "pult");
var auth = app.auth(), db = app.firestore(), rtdb = app.database();

var A = {
  users: [],          /* [{ uid, doc, unicorns: {leny: profil} }] */
  events: [],         /* [{ id, uid, unicornId, type, ts: Date, data }] (újabb elöl) */
  fulek: "attekintes",
  jatekos: null,
  csakHibak: false,
  palyaSzuro: "",
  esemenyLeir: null,
  cfg: {},            /* producerConfig: uid → { overrides, notes } */
  groups: [],         /* [{ id, name, members: [uid], overrides }] */
  bCel: null,         /* Beállítások fül célpontja: "u:<uid>" vagy "g:<gid>" */
  urlap: null,        /* ✏️ Egyéni pályák: a nyitott űrlap állapota (null = zárva) */
  beallLeir: [],
  kert: { beall: {}, jog: {}, jelen: {} },   /* 🌈 Égi Tüneménykert (RTDB) */
  kertLeir: null
};
/* a kapu-kulcs pályák (a játék src/engine-logic.js KAPU_KULCSOK-ja): ezek nyitják a 12 órás kaput,
   nélkülük a többi pálya alszik → nem rejthetők el (a játék is figyelmen kívül hagyná) */
var KULCS_PALYAK = ["bontas-felmondas", "szorzo-dallam"];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function ketj(n) { return (n < 10 ? "0" : "") + n; }
function napKulcs(d) { return d.getFullYear() + "-" + ketj(d.getMonth() + 1) + "-" + ketj(d.getDate()); }
function idoKi(d) {
  if (!d) return "–";
  var ma = napKulcs(new Date()), tegnap = napKulcs(new Date(Date.now() - NAP)), k = napKulcs(d);
  var ora = ketj(d.getHours()) + ":" + ketj(d.getMinutes());
  if (k === ma) return "ma " + ora;
  if (k === tegnap) return "tegnap " + ora;
  return (d.getMonth() + 1) + ". " + d.getDate() + ". " + ora;
}
function percKi(mp) {
  mp = Math.round(mp || 0);
  if (mp < 60) return mp + " mp";
  var p = Math.round(mp / 60);
  if (p < 60) return p + " perc";
  return Math.floor(p / 60) + " óra " + (p % 60) + " perc";
}
function szazalek(a, b) { return b ? Math.round(100 * a / b) + "%" : "–"; }
function sav(a, b) {
  if (!b) return '<span class="halvany">–</span>';
  var r = a / b, cl = r < GYENGE_ARANY ? "gyenge" : r < 0.8 ? "kozepes" : "";
  return '<div style="display:flex;gap:8px;align-items:center"><div class="sav"><i class="' + cl + '" style="width:' + Math.round(r * 100) + '%"></i></div>' + Math.round(r * 100) + "%</div>";
}
function tsDate(t) { return t && t.toDate ? t.toDate() : (t instanceof Date ? t : null); }
function palyaSorrend(id) { return PALYA[id] ? PALYA[id].sorrend : 999; }
function palyaNev(id) { var p = PALYA[id]; return p ? p.ikon + " " + p.nev : (id || "–"); }
function lenyNev(k) { return (LENY_IKON[k] || "🦄") + " " + (LENY_NEV[k] || k || "–"); }

/* ── játékos megnevezése: a játék által felírt kód (LILI-15), különben becenév / uid-eleje ── */
function jNev(uid) {
  var u = userById(uid);
  if (!u) return "? " + String(uid).slice(0, 6);
  if (u.doc.kod) return u.doc.kod;
  for (var k in u.unicorns) if (u.unicorns[k].becenev) return u.unicorns[k].becenev;
  var l = Object.keys(u.unicorns);   /* még nincs kódja a doc-ban (régi mentés): az unikornisai alapján ismerhető fel */
  if (l.length) return l.map(function (k) { return lenyNev(k) + " " + (+u.unicorns[k].csillampor || 0) + "✨"; }).join(" + ");
  return "játékos " + uid.slice(0, 6);
}
function userById(uid) { for (var i = 0; i < A.users.length; i++) if (A.users[i].uid === uid) return A.users[i]; return null; }

/* ══════════ pálya-nevek a játék forrásából ══════════ */
function palyakBetolt() {
  return fetch("../src/constants.js", { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (t) {
    var re = /id:\s*"([^"]+)",\s*nev:\s*"([^"]+)",\s*ikon:\s*"([^"]+)"/g, m, i = 0;
    while ((m = re.exec(t))) { PALYA[m[1]] = { nev: m[2], ikon: m[3], sorrend: i++ }; PALYA_SORREND.push(m[1]); }
    var rt = /id:\s*"([^"]+)"[\s\S]*?alap:\s*\{\s*tipus:\s*"([^"]+)"/g;   /* a nehézség-oszlopokhoz */
    while ((m = rt.exec(t))) if (PALYA[m[1]]) PALYA[m[1]].tipus = m[2];
    var rl = /(\w+):\s*\{\s*nev:\s*"([^"]+)"/g;
    while ((m = rl.exec(t))) if (!PALYA[m[1]] && m[1].length < 20) LENY_NEV[m[1]] = m[2];
  }).catch(function () { /* nélküle is megy: az azonosítók látszanak */ });
}

/* ══════════ belépés ══════════ */
function belepes() {
  var hiba = $("b-hiba"), gomb = $("b-gomb");
  hiba.textContent = ""; gomb.disabled = true; gomb.textContent = "Egy pillanat…";
  auth.signInWithEmailAndPassword($("b-email").value.trim(), $("b-jelszo").value).catch(function (e) {
    var c = (e && e.code) || "";
    hiba.textContent = c === "auth/network-request-failed" ? "Nincs internet."
      : c === "auth/too-many-requests" ? "Túl sok próbálkozás — várj pár percet."
      : "Hibás e-mail vagy jelszó.";
    gomb.disabled = false; gomb.textContent = "Belépés";
  });
}
$("b-gomb").onclick = belepes;
$("b-jelszo").addEventListener("keydown", function (e) { if (e.key === "Enter") belepes(); });
$("kilep").onclick = function () {
  if (A.esemenyLeir) A.esemenyLeir();
  A.beallLeir.forEach(function (f) { f(); }); A.beallLeir = [];
  if (A.kertLeir) { A.kertLeir(); A.kertLeir = null; }
  auth.signOut();
};
$("frissit").onclick = function () { jatekosokBetolt().then(rajzol); };
$("idoszak").onchange = rajzol;

auth.onAuthStateChanged(function (u) {
  if (!u) { $("belepes").hidden = false; $("pult").hidden = true; $("b-jelszo").value = ""; $("b-gomb").disabled = false; $("b-gomb").textContent = "Belépés"; return; }
  $("belepes").hidden = true; $("pult").hidden = false;
  $("ki-belepve").textContent = u.email;
  palyakBetolt().then(function () { return jatekosokBetolt(); }).then(function () {
    esemenyekFigyel();
    beallitasokFigyel();
    kertFigyel();
    rajzol();
  }).catch(jogHiba);
});

function jogHiba(e) {
  console.warn("[pult]", e);
  var c = (e && e.code) || "";
  $("tartalom").innerHTML = '<div class="kartya"><h3>🔒 Nincs hozzáférés</h3><p>' +
    (c === "permission-denied"
      ? "A Firebase nem engedi olvasni az adatokat. Vagy nem az admin fiókkal léptél be, vagy még nincsenek publikálva az új szabályok (Firestore Database → Rules)."
      : "Hiba az adatok betöltésekor: " + esc(c || e)) + "</p></div>";
}

/* ══════════ adatok ══════════ */
function jatekosokBetolt() {
  return db.collection("users").get().then(function (snap) {
    var lista = [];
    snap.forEach(function (d) { lista.push({ uid: d.id, doc: d.data(), unicorns: {} }); });
    return Promise.all(lista.map(function (u) {
      return db.collection("users").doc(u.uid).collection("unicorns").get().then(function (s) {
        s.forEach(function (d) { u.unicorns[d.id] = d.data(); });
      });
    })).then(function () {
      lista.sort(function (a, b) { return jNevNyers(a).localeCompare(jNevNyers(b), "hu"); });
      A.users = lista;
    });
  });
}
function jNevNyers(u) { return u.doc.kod || u.uid; }

function esemenyekFigyel() {
  if (A.esemenyLeir) A.esemenyLeir();
  var tol = new Date(Date.now() - ESEMENY_NAPOK * NAP);
  A.esemenyLeir = db.collection("events").where("ts", ">=", tol).orderBy("ts", "desc").limit(ESEMENY_LIMIT)
    .onSnapshot(function (snap) {
      var l = [];
      snap.forEach(function (d) {
        var x = d.data(), t = tsDate(x.ts);
        if (!t) return;
        l.push({ id: d.id, uid: x.uid, unicornId: x.unicornId, type: x.type, ts: t, data: x.data || {} });
      });
      A.events = l;
      /* ismeretlen uid (új játékos) → játékosok újratöltése */
      var uj = l.some(function (e) { return !userById(e.uid); });
      if (uj) jatekosokBetolt().then(rajzol); else rajzol();
    }, jogHiba);
}

function idoszakTol() {
  var n = +$("idoszak").value;
  if (n === 1) { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  return new Date(Date.now() - n * NAP);
}
function esemenyek(szuro) {
  var tol = idoszakTol();
  return A.events.filter(function (e) {
    if (e.ts < tol) return false;
    if (szuro && szuro.uid && e.uid !== szuro.uid) return false;

    '<div class="ksor"><label><input type="checkbox" id="k-nyitva"' + (b.nyitva ? " checked" : "") + '> <b>Nyitva</b></label></div>' +
    '<div class="ksor"><label><input type="checkbox" id="k-orak"' + (b.orak ? " checked" : "") + '> Nyitvatartás beállítása</label></div>' +
    '<div class="ksor"' + (b.orak ? "" : " hidden") + '>' + KERT_NAPOK.map(function (n, i) {
      return '<label><input type="checkbox" class="k-nap" value="' + (i + 1) + '"' + (napok.indexOf(String(i + 1)) >= 0 ? " checked" : "") + ">" + n + "</label>";
    }).join("") + '</div>' +
    '<div class="ksor"' + (b.orak ? "" : " hidden") + '>' +
      '<input type="time" id="k-tol" value="' + esc(b.tol || "16:00") + '"> – <input type="time" id="k-ig" value="' + esc(b.ig || "19:00") + '"></div>' +
    '<div class="ksor">Belépés előtt aznap végigjárt ösvény: <select id="k-napi">' +
      [0, 1, 2, 3, 4, 5].map(function (n) { return opt(n, n ? n + " db" : "nem kell", +b.napiPalya || 0); }).join("") + "</select></div>" +
    '<div class="ksor">Felhőidő naponta: <select id="k-ido">' +
      [0, 10, 15, 20, 30, 45, 60].map(function (n) { return opt(n, n ? n + " perc" : "nincs korlát", +b.idokorlat || 0); }).join("") + "</select></div>" +
    '<div class="kallapot ' + all[0] + '">' + esc(all[1]) + "</div></div>";
  h += '<div class="kartya"><h3>☁️ Most bent</h3><div id="k-bent">' + kertBentHTML() + "</div></div>";
  var gb = b.gesztusok || {};
  h += '<div class="kartya"><h3>👋 Gesztusok</h3><p class="kicsi halvany" style="margin:0 0 6px">Amelyik nincs bepipálva, az a gyerekeknél azonnal eltűnik.</p>' +
    KERT_GESZTUSOK.map(function (g) {
      return '<div class="ksor"><label><input type="checkbox" class="k-gesztus" value="' + g[0] + '"' + (gb[g[0]] === false ? "" : " checked") + "> " + g[1] + "</label></div>";
    }).join("") + "</div></div>";

  h += '<h3 style="margin:22px 0 8px">Ki mehet fel, és kivel van egy kertben?</h3>' +
    '<p class="kicsi halvany" style="margin:0 0 8px">Akik ugyanabban a kertben vannak, látják egymást; más kertben lévőt nem. A becenév látszik az unikornis fölött (ha üres: az unikornis neve).</p>' +
    '<div class="tabla-keret"><table><tr><th>Játékos</th><th>Felmehet</th><th>Becenév</th><th>Melyik kert</th></tr>';
  A.users.forEach(function (u) {
    var j = A.kert.jog[u.uid], sz = j ? j.szoba : "kozos";
    h += '<tr data-kuid="' + esc(u.uid) + '"><td>' + esc(jNev(u.uid)) + "</td>" +
      '<td><input type="checkbox" class="k-jog"' + (j ? " checked" : "") + "></td>" +
      '<td><input class="becenev k-becenev" maxlength="20" value="' + esc(j ? (j.becenev || "") : "") + '" placeholder="' + esc(kertBecenevJavaslat(u) || "becenév") + '"></td>' +
      '<td><select class="k-szoba">' + opt("kozos", "🌈 Közös kert", sz) +
        A.groups.map(function (g) { return opt("cs-" + g.id, "👥 " + esc(g.name) + " kertje", sz); }).join("") +
        (sz !== "kozos" && !csoportById(String(sz).replace(/^cs-/, "")) ? opt(sz, "❓ törölt csoport", sz) : "") + "</select></td></tr>";
  });
  h += "</table></div>";
  t.innerHTML = h;

  function altalanosMent() {
    var nk = "";
    Array.prototype.forEach.call(t.querySelectorAll(".k-nap"), function (c) { if (c.checked) nk += c.value; });
    ment(rtdb.ref("kertBeall").update({
      nyitva: $("k-nyitva").checked, orak: $("k-orak").checked, napok: nk,
      tol: $("k-tol").value || "16:00", ig: $("k-ig").value || "19:00",
      napiPalya: +$("k-napi").value, idokorlat: +$("k-ido").value
    }));
  }
  ["k-nyitva", "k-orak", "k-tol", "k-ig", "k-napi", "k-ido"].forEach(function (id) { $(id).onchange = altalanosMent; });
  Array.prototype.forEach.call(t.querySelectorAll(".k-nap"), function (c) { c.onchange = altalanosMent; });
  Array.prototype.forEach.call(t.querySelectorAll(".k-gesztus"), function (c) {
    c.onchange = function () { ment(rtdb.ref("kertBeall/gesztusok/" + c.value).set(c.checked)); };
  });
  Array.prototype.forEach.call(t.querySelectorAll("tr[data-kuid]"), function (sor) {
    var uid = sor.dataset.kuid, ref = rtdb.ref("kertJog/" + uid);
    var jog = sor.querySelector(".k-jog"), bn = sor.querySelector(".k-becenev"), szb = sor.querySelector(".k-szoba");
    jog.onchange = function () {
      if (!jog.checked) { ment(ref.remove()); return; }
      if (!bn.value.trim() && bn.placeholder !== "becenév") bn.value = bn.placeholder;
      ment(ref.set({ szoba: szb.value, becenev: bn.value.trim().slice(0, 20) }));
    };
    bn.onchange = function () { if (jog.checked) ment(ref.update({ becenev: bn.value.trim().slice(0, 20) })); };
    szb.onchange = function () { if (jog.checked) ment(ref.update({ szoba: szb.value })); };
  });
}

})();
</script>
</body>
</html>
