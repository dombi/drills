<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Producer-pult · Unikornis Centum</title>
<!--
  Unikornis Centum — Producer-pult (backend 3–4. fázis)
  Olvas: users + unicorns (+ 🌸 tenyek/tenyTipus a Tények fülön) + events. Ír (4. fázis): producerConfig (egyéni felülírások, megjegyzés, egyéni pályák, teny) + groups (csoportok + csoport-pályák). Belépés: admin@unikornis.app (a producer saját jelszavával).
  Az admin-jogot a firestore.rules isAdmin() adja (e-mail alapján) — Cloud Function nélkül.
  FONTOS: külön Firebase-app ("pult") → a belépés NEM keveredik a játék belépésével ugyanabban a böngészőben.
-->
<style>
:root{
  --lila:#b79fd4; --lila-vil:#e9ddf3; --lila-sotet:#4a3b7a; --halvany:#8f7ab8;
  --rozsa:#f6a5c0; --menta:#a7d99a; --menta-mely:#4f9a4d; --sarga:#fce49a; --kek:#9ec9f0;
  --piros:#d9546e; --hatter:#f4eef8; --kartya:#ffffff; --keret:#e2d6ee; --szoveg:#3d3266;
}
*{ box-sizing:border-box; margin:0; padding:0; }
[hidden]{ display:none !important; }
body{ font-family:"Segoe UI",system-ui,sans-serif; background:var(--hatter); color:var(--szoveg); font-size:15px; line-height:1.45; }
button,select,input{ font:inherit; color:inherit; }
button{ cursor:pointer; border:none; border-radius:10px; padding:7px 14px; background:var(--lila-vil); color:var(--lila-sotet); font-weight:600; }
button:hover{ filter:brightness(.96); }
button.fo{ background:var(--lila-sotet); color:#fff; }
button.aktiv{ background:var(--lila-sotet); color:#fff; }
select,input{ border:1px solid var(--keret); border-radius:10px; padding:7px 10px; background:#fff; }
h2{ font-size:19px; margin:4px 0 12px; }
h3{ font-size:16px; margin:18px 0 8px; }
.halvany{ color:var(--halvany); }
.kicsi{ font-size:13px; }

/* belépés */
#belepes{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.belepo{ background:#fff; border-radius:20px; padding:28px; width:100%; max-width:360px; box-shadow:0 8px 30px rgba(74,59,122,.12); text-align:center; }
.belepo h1{ font-size:22px; margin:6px 0 4px; }
.belepo input{ width:100%; margin-top:10px; }
.belepo button{ width:100%; margin-top:14px; padding:10px; }
.hiba{ color:var(--piros); margin-top:10px; min-height:1.2em; font-size:14px; }

/* fejléc + fülek */
header{ background:#fff; border-bottom:1px solid var(--keret); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; z-index:5; }
header .cim{ font-weight:700; font-size:17px; margin-right:auto; }
nav{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px 0; max-width:1200px; margin:0 auto; }
main{ max-width:1200px; margin:0 auto; padding:14px 16px 40px; }
.eszkozsor{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }

/* kártyák */
.racs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.kartya{ background:var(--kartya); border:1px solid var(--keret); border-radius:16px; padding:14px 16px; }
.kartya.kattinthato{ cursor:pointer; }
.kartya.kattinthato:hover{ border-color:var(--lila); }
.kartya h3{ margin:0 0 6px; display:flex; align-items:center; gap:8px; }
.szamok{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:8px; }
.szamok b{ font-size:18px; display:block; }
.szamok span{ font-size:12px; color:var(--halvany); }
.pont{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.pont.most{ background:var(--menta-mely); box-shadow:0 0 0 3px rgba(79,154,77,.25); }
.pont.friss{ background:var(--menta); } .pont.regi{ background:var(--sarga); } .pont.nagyonregi{ background:var(--piros); }

/* figyelmeztetések */
.figy{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.figy div{ background:#fff7e0; border:1px solid #f1dd9c; border-radius:12px; padding:8px 12px; }
.figy div.piros{ background:#fdecef; border-color:#f3bcc7; }
.figy div.zold{ background:#eef8ec; border-color:#c6e6bf; }

/* táblázatok */
.tabla-keret{ overflow-x:auto; background:#fff; border:1px solid var(--keret); border-radius:14px; }
table{ border-collapse:collapse; width:100%; font-size:14px; }
th,td{ padding:7px 10px; text-align:left; border-bottom:1px solid #f0e8f6; white-space:nowrap; }
th{ background:#faf6fd; font-weight:600; color:var(--halvany); font-size:13px; position:sticky; top:0; }
td.szam, th.szam{ text-align:right; }
tr.rossz td{ background:#fdf1f3; }
td.tores{ white-space:normal; max-width:420px; }
.jo{ color:var(--menta-mely); font-weight:700; } .rossz-sz{ color:var(--piros); font-weight:700; }
.sav{ height:8px; background:#f0e8f6; border-radius:4px; overflow:hidden; min-width:60px; }
.sav i{ display:block; height:100%; background:var(--menta); }
.sav i.gyenge{ background:var(--piros); } .sav i.kozepes{ background:var(--sarga); }

/* naptár */
.naptar{ display:grid; grid-template-columns:repeat(7,26px); gap:4px; }
.naptar div{ width:26px; height:26px; border-radius:6px; background:#f0e8f6; font-size:10px; display:flex; align-items:center; justify-content:center; color:var(--halvany); }
.naptar div.jatszott{ background:var(--menta); color:#234; font-weight:700; }
.naptar div.ma{ outline:2px solid var(--lila-sotet); }
.naptar .fej{ background:none; font-weight:600; }
.ures{ padding:20px; text-align:center; color:var(--halvany); }

/* beállítások (4. fázis) */
.celsor{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
.celsor .cimke{ font-size:13px; color:var(--halvany); margin-right:4px; min-width:80px; }
td select{ padding:4px 6px; font-size:14px; }
td select.beallitva{ background:#fff3d6; border-color:#f1d08a; font-weight:600; }
.pipak{ display:inline-flex; flex-wrap:wrap; gap:1px 5px; padding:3px 6px; border:1px solid var(--keret); border-radius:10px; font-size:13px; min-width:205px; max-width:240px; }
.pipak input{ margin:0 1px 0 0; }
.pipak.beallitva{ background:#fff3d6; border-color:#f1d08a; font-weight:600; }
.pipak label{ display:inline-flex; align-items:center; gap:1px; white-space:nowrap; cursor:pointer; }
tr.kulcs td:first-child::after{ content:" 🔑"; }
.hatas{ font-size:13px; }
.kapu-sor{ display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin:6px 0; }
.kapu-sor select{ padding:4px 6px; font-size:14px; }
.kapu-sor select.beallitva{ background:#fff3d6; border-color:#f1d08a; font-weight:600; }
tr.egyeni-sor td:first-child{ font-style:italic; }
/* 🏦 Tündérbank kártya */
.bank-sor{ display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:8px 0 4px; }
.bank-sor label{ display:inline-flex; align-items:center; gap:5px; font-size:14px; }
.bank-sor select{ padding:4px 6px; font-size:14px; }
.bank-sor select.beallitva{ background:#fff3d6; border-color:#f1d08a; font-weight:600; }
.bank-palyak{ margin:6px 0 4px; }
.bank-palyak summary{ cursor:pointer; font-size:14px; }
.bank-palyak.beallitva summary{ background:#fff3d6; border-radius:8px; padding:2px 6px; display:inline-block; font-weight:600; }
.bank-palyak .liget{ margin:6px 0 2px; font-size:13px; font-weight:700; color:var(--halvany); }
.bank-palyak .pl{ display:flex; flex-wrap:wrap; gap:2px 12px; font-size:13px; }
.bank-palyak .pl label{ display:inline-flex; align-items:center; gap:3px; cursor:pointer; }
.bank-palyak .pl label.halvany{ opacity:.55; cursor:default; }
.bank-palyak .liget label{ cursor:pointer; }
tr.liget-sor td{ background:#efe7fb; padding-top:10px; }
tr.liget-sor .liget-gombok{ display:inline-flex; gap:6px; margin-left:14px; vertical-align:middle; }
tr.liget-sor button{ font-size:12px; padding:3px 8px; }
/* 🌈 Tüneménykert (5. fázis) */
.ksor{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:8px 0; }
.ksor label{ display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
.ksor input[type=time]{ padding:4px 6px; }
.kallapot{ margin-top:10px; padding:8px 12px; border-radius:12px; background:#eef8ec; border:1px solid #c6e6bf; font-size:14px; white-space:normal; }
.kallapot.zarva{ background:#fdecef; border-color:#f3bcc7; }
.dsz-szoba{ margin:10px 0 4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.dsz-sor{ display:flex; align-items:center; gap:8px; padding:3px 0; border-bottom:1px solid #f0e8f8; }
.dsz-sor svg{ width:28px; height:30px; flex:none; }
.dsz-sor .dsz-ki{ flex:1; }
.dsz-gomb{ border:1px solid #e3cfe0; background:#fff; border-radius:8px; padding:2px 8px; cursor:pointer; }
.dsz-urit{ border:1px solid #f3bcc7; background:#fdecef; color:#a33a55; border-radius:8px; padding:3px 10px; cursor:pointer; font-weight:700; }
.bent-szoba{ margin:6px 0; } .bent-szoba b{ display:block; font-size:13px; color:var(--halvany); }
.bent-nev{ display:inline-block; margin:3px 4px 0 0; padding:3px 10px; border-radius:99px; background:#f3ecff; font-weight:600; }
td input.becenev{ width:150px; padding:4px 8px; }
.tagok{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:6px; }
textarea{ font:inherit; width:100%; min-height:70px; border:1px solid var(--keret); border-radius:10px; padding:8px 10px; resize:vertical; }
#mentve{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--lila-sotet); color:#fff; padding:8px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; }
#mentve.lathato{ opacity:1; }
#mentve.hiba{ background:var(--piros); }
/* egyéni pályák (4b) */
.urlap{ margin-bottom:16px; border-color:var(--lila); }
.usor{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:flex-start; margin:8px 0; }
.usor .cimke{ font-size:13px; color:var(--halvany); min-width:90px; padding-top:7px; }
.ikonok, .sablonok{ display:flex; flex-wrap:wrap; gap:5px; }
.ikonok button{ font-size:19px; padding:3px 8px; }
.pipak.fajtak{ max-width:none; width:min(560px,100%); display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); padding:6px 10px; }
.elonezet{ margin:2px 0 4px 20px; font-size:14px; }
/* 🌸 Tények (tény-motor 2. kör) */
.teny-tablak{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; margin-top:12px; }
.teny-kert-agyak{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-top:8px; }
.tv-pult{ width:100%; height:auto; display:block; border-radius:12px; }
.teny-racs{ width:auto; border-collapse:separate; border-spacing:2px; font-size:11px; }
.teny-racs th{ background:none; position:static; padding:0; width:28px; height:22px; text-align:center; color:var(--halvany); border:none; }
.teny-racs td{ padding:0; border:2px solid transparent; border-radius:7px; cursor:pointer; }
.teny-racs td.botlo{ border-color:var(--piros); }
.teny-racs td.kij{ outline:2px solid var(--lila-sotet); outline-offset:1px; }
.teny-racs .cella{ position:relative; width:26px; height:26px; border-radius:5px; overflow:hidden; background:#fff; }
.teny-racs .cella i{ position:absolute; left:0; right:0; }
.teny-racs .cella .fel{ top:0; height:55%; }
.teny-racs .cella .le{ bottom:0; height:43%; }
.teny-racs .cella .le1{ bottom:0; height:43%; right:51%; }
.teny-racs .cella .le2{ bottom:0; height:43%; left:51%; }
.teny-racs td.esed .cella::after{ content:""; position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%; background:#3d6fd8; box-shadow:0 0 0 1px #fff; }
.l-uj{ background:#ece6f1; } .l-tanulja{ background:#fbd27a; } .l-tudja{ background:#9fd0f3; } .l-villam{ background:#5cb85f; }
.folt{ display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:3px; }
.teny-ossz{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px; margin:2px 0 8px; }
.teny-racs .cella .hh{ position:absolute; left:0; top:-1px; font-size:10px; line-height:1; font-style:normal; z-index:1; filter:drop-shadow(0 0 1px #fff); }   /* 🌿 a „mi bújt el” formában botlik */
.hh-sor{ padding:1px 0 0 18px !important; }
.teny-kij{ margin-top:12px; border-color:var(--lila); } .teny-kij div{ padding:3px 0; }
.betuk i{ font-style:normal; font-family:ui-monospace,Consolas,monospace; font-weight:700; font-size:12px; padding:0 2px; border-radius:3px; margin-right:1px; }
.betuk .b-V{ background:#d8f0d8; color:#2f7a32; } .betuk .b-J{ background:#dcecfa; color:#2d5f8a; } .betuk .b-S{ background:#eee; color:#777; } .betuk .b-H{ background:#fbdde3; color:#b2324f; }
.kal{ display:inline-block; margin:2px 4px 0 0; padding:1px 7px; border-radius:99px; background:#f3ecff; }
.kal.most{ background:var(--lila-sotet); color:#fff; }
@media (max-width:420px){ .teny-tablak{ grid-template-columns:1fr; } .teny-racs th{ width:24px; } .teny-racs .cella{ width:23px; height:23px; } }
</style>
</head>
<body>

<section id="belepes" hidden>
  <div class="belepo">
    <div style="font-size:40px">🦄📊</div>
    <h1>Producer-pult</h1>
    <p class="halvany kicsi">Unikornis Centum</p>
    <input id="b-email" type="email" autocomplete="username" value="admin@unikornis.app">
    <input id="b-jelszo" type="password" autocomplete="current-password" placeholder="Jelszó">
    <button id="b-gomb" class="fo">Belépés</button>
    <div id="b-hiba" class="hiba"></div>
  </div>
</section>

<section id="pult" hidden>
  <header>
    <span class="cim">🦄 Producer-pult</span>
    <label class="kicsi halvany">Időszak
      <select id="idoszak">
        <option value="1">ma</option>
        <option value="7" selected>7 nap</option>
        <option value="30">30 nap</option>
        <option value="90">90 nap</option>
      </select>
    </label>
    <button id="frissit" title="Játékos-adatok újratöltése">↻ Frissítés</button>
    <span id="ki-belepve" class="kicsi halvany"></span>
    <button id="kilep">Kilépés</button>
  </header>
  <nav id="fulek"></nav>
  <main id="tartalom"><div class="ures">Adatok betöltése…</div></main>
</section>
<div id="mentve"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../tk-diszek.js?v=20260924-1"></script>
<script src="../src/teny.js?v=20261007-2"></script><!-- 🌸 a tény-motor közös függvényei (tenyCsaladok, tenyLepcso, tenyOsszevon…) — ugyanaz a fájl, mint a játékban -->
<script src="../src/gondozas.js?v=20261006-4"></script><!-- 🌱 gondozás: gyakorlós nap, igény (szomjúság) — a „gyerek kertje” nézethez, ugyanaz a fájl, mint a játékban -->
<script src="../src/kert-tajkep.js?v=20261006-1"></script><!-- 🌿 a kert rajz-segédei (ktR, ktHash, ktP) a virágokhoz -->
<script src="../src/teny-kert.js?v=20261006-3"></script><!-- 🌷 Tény-kert: a virágok kinézete és a tövek helye — a „gyerek kertje” ugyanazt rajzolja, mint a játék -->
<script>
(function () {
"use strict";

/* ugyanaz a projekt, mint a játékban (src/firebase-config.js) — a config nem titok, a védelmet a rules adja */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyD7O40iCaeSryo17HEOVcWKJ0263LY5-fw",
  authDomain: "unicornis-centum.firebaseapp.com",
  projectId: "unicornis-centum",
  storageBucket: "unicornis-centum.firebasestorage.app",
  messagingSenderId: "198411098733",
  appId: "1:198411098733:web:e55f82c3b71fe347123d64",
  databaseURL: "https://unicornis-centum-default-rtdb.europe-west1.firebasedatabase.app"
};
var NAP = 86400000;
var ESEMENY_NAPOK = 90;           /* ennyi napnyi eseményt töltünk be (a szűrés utána helyben megy) */
var ESEMENY_LIMIT = 5000;
var INAKTIV_NAP = 3;              /* ennyi nap szünet után figyelmeztet */
var GYENGE_ARANY = 0.6;           /* ez alatti elsőre-arány egy pályán = figyelmeztetés */

var LENY_NEV = { ragyogas: "Ragyogás", tuz: "Tűz", csillamharmat: "Csillámharmat" };
var LENY_IKON = { ragyogas: "🤍", tuz: "🔥", csillamharmat: "💧" };
var EK_MESTER_ALAP = {};          /* 🧱 kocka → [Mesterpróba-feladat id] (src/constants.js EK_KOCKA_DEF) */
var PALYA = {};                   /* id → { nev, ikon, sorrend } — a játék src/constants.js-éből olvassuk */
var PALYA_SORREND = [];

/* külön app-név: a belépés nem ütközik a játék [DEFAULT] belépésével ugyanabban a böngészőben */
var app = firebase.initializeApp(FIREBASE_CONFIG, "pult");
var auth = app.auth(), db = app.firestore(), rtdb = app.database();

var A = {
  users: [],          /* [{ uid, doc, unicorns: {leny: profil} }] */
  events: [],         /* [{ id, uid, unicornId, type, ts: Date, data }] (újabb elöl) */
  fulek: "attekintes",
  jatekos: null,
  csakHibak: false,
  palyaSzuro: "",
  esemenyLeir: null,
  cfg: {},            /* producerConfig: uid → { overrides, notes } */
  groups: [],         /* [{ id, name, members: [uid], overrides }] */
  bCel: null,         /* Beállítások fül célpontja: "u:<uid>" vagy "g:<gid>" */
  urlap: null,        /* ✏️ Egyéni pályák: a nyitott űrlap állapota (null = zárva) */
  beallLeir: [],
  ft: { feladatok: {}, valt: {}, palyak: {}, betoltve: false, uzenet: "" },   /* 🏔️ Fejtörő: versenyFeladatok + versenyPalyak */
  kert: { beall: {}, jog: {}, jelen: {}, diszek: {} },   /* 🌈 Égi Tüneménykert (RTDB) */
  kertLeir: null
};
/* a kapu (2026-09-27): a kulcs-pályákat és a kapu óraszámát itt, a 🎛️ Beállításokban választod
   (overrides[id].kulcs + kapuOrak); a játék src/engine-logic.js kapuKulcsok()-ja olvassa. 0 kulcs = nincs kapu. */
var KAPU_ALAP_ORAK = 12;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function ketj(n) { return (n < 10 ? "0" : "") + n; }
function napKulcs(d) { return d.getFullYear() + "-" + ketj(d.getMonth() + 1) + "-" + ketj(d.getDate()); }
function idoKi(d) {
  if (!d) return "–";
  var ma = napKulcs(new Date()), tegnap = napKulcs(new Date(Date.now() - NAP)), k = napKulcs(d);
  var ora = ketj(d.getHours()) + ":" + ketj(d.getMinutes());
  if (k === ma) return "ma " + ora;
  if (k === tegnap) return "tegnap " + ora;
  return (d.getMonth() + 1) + ". " + d.getDate() + ". " + ora;
}
function percKi(mp) {
  mp = Math.round(mp || 0);
  if (mp < 60) return mp + " mp";
  var p = Math.round(mp / 60);
  if (p < 60) return p + " perc";
  return Math.floor(p / 60) + " óra " + (p % 60) + " perc";
}
function szazalek(a, b) { return b ? Math.round(100 * a / b) + "%" : "–"; }
function sav(a, b) {
  if (!b) return '<span class="halvany">–</span>';
  var r = a / b, cl = r < GYENGE_ARANY ? "gyenge" : r < 0.8 ? "kozepes" : "";
  return '<div style="display:flex;gap:8px;align-items:center"><div class="sav"><i class="' + cl + '" style="width:' + Math.round(r * 100) + '%"></i></div>' + Math.round(r * 100) + "%</div>";

  var kockak = Object.keys(EK_MESTER_ALAP).sort();
  h += '<div class="kartya" style="margin-top:14px"><h3>🏅 Mesterpróba-feladat (kockánként)</h3>' +
    '<p class="kicsi halvany">A Fejtörő-hegyre feltöltött feladatokból. A gyerek sorban kapja őket (egy próba = egy feladat); egy teljes kör után a számváltozataik jönnek. Üres = az alap.</p>' +
    (kockak.length ? '<div class="tabla-keret"><table><tr><th>Kocka</th><th>1. feladat</th><th>2. feladat</th><th>Alap</th></tr>' + kockak.map(function (k) {
      var fel = (A.ft.palyak["mester-" + k] || {}).feladatok || [], alap = EK_MESTER_ALAP[k] || [];
      function sel(i) {
        return '<select data-ekm="' + k + '" data-i="' + i + '"' + (fel[i] ? ' class="beallitva"' : "") + '><option value="">— alap</option>' + fl.map(function (f) {
          return '<option value="' + esc(f[0]) + '"' + (fel[i] === f[0] ? " selected" : "") + ">" + esc(f[1]) + "</option>";
        }).join("") + "</select>";
      }
      return "<tr><td>" + esc(ekKockaNev(k)) + "</td><td>" + sel(0) + "</td><td>" + sel(1) + '</td><td class="kicsi">' + alap.map(function (id) {
        return esc(ftFeladatNev(id)) + (A.ft.feladatok[id] ? "" : ' <span class="rossz-sz">⚠️ nincs feltöltve</span>');
      }).join("<br>") + "</td></tr>";
    }).join("") + "</table></div>" : '<div class="ures">A kockák listája nem töltődött be (src/constants.js).</div>') +
    '<p class="kicsi halvany" style="margin-top:6px">A 🔤 Kis szavak két új feladata (telefonszám, a 23 számszomszédai) a <b>fejtoro-mesterproba.json</b> + <b>fejtoro-mesterproba-valtozatok.json</b> fájlban van — a 🏔️ Fejtörő fülön töltsd fel (előbb az elsőt).</p></div>';
  t.innerHTML = h;

  var FV = firebase.firestore.FieldValue;
  Array.prototype.forEach.call(t.querySelectorAll("[data-ekcel]"), function (b) { b.onclick = function () { A.bCel = b.dataset.ekcel; rajzol(); }; });
  var ref = egyeni ? db.collection("producerConfig").doc(cid) : db.collection("groups").doc(cid);
  function stabilMent() {
    var n = $("ek-nap").value, a = $("ek-arany").value, o = {};
    if (n) o.nap = +n; if (a) o.arany = +a;
    ment(ref.set({ ekStabil: (n || a) ? o : FV.delete(), updatedAt: FV.serverTimestamp() }, { merge: true }));
  }
  $("ek-nap").onchange = stabilMent; $("ek-arany").onchange = stabilMent;
  Array.prototype.forEach.call(t.querySelectorAll("[data-ekm]"), function (sl) {
    sl.onchange = function () {
      var k = sl.dataset.ekm, l = [], sajat = false, alap = EK_MESTER_ALAP[k] || [];
      /* az üres hely az alap ugyanannyiadik feladatát tartja meg; ha egyik sincs átállítva → a felülírás törlődik */
      Array.prototype.forEach.call(t.querySelectorAll('[data-ekm="' + k + '"]'), function (x, i) {
        if (x.value) sajat = true;
        var v = x.value || alap[i]; if (v && l.indexOf(v) < 0) l.push(v);
      });
      var dref = db.collection("versenyPalyak").doc("mester-" + k);
      var p = sajat && l.length ? dref.set({ liget: "mesterproba", kocka: k, nev: "🏅 Mesterpróba " + k, feladatok: l, updatedAt: FV.serverTimestamp() }) : dref.delete();
      ment(p.then(function () { return ftBetolt(); }).then(function () { if (A.fulek === "epitokocka") rajzol(); }));
    };
  });
}

/* ══════════ 🏔️ Fejtörő (Zrínyi-állomás): feladatok feltöltése + válasz-napló ══════════
   A feladatszövegek a felhőben vannak (versenyFeladatok/{id}, versenyPalyak/{id}); a nyilvános repóban NINCSENEK.
   Feltöltés: a Matekos\versenyfeladatok\ mappában készült JSON ({ formatum:"uc-fejtoro-1", feladatok:[…], palyak:[…] }).
   Számváltozatok: fejtoro-valtozatok.json ({ formatum:"uc-fejtoro-valtozat-1", valtozatok:{alapId:[…]} }) — ugyanabba
   a gyűjteménybe megy ({alapId}-vNN, alapId mezővel); egy feladat újrafeltöltésekor a fájlból kimaradt régi változatai törlődnek.
   Napló: a játék minden válasznál „fejtoro_valasz” eseményt ír (betű, jó/rossz, segítség-lépés, csapda, idő, visszatérő, változat). */
function ftBetolt() {
  return Promise.all([db.collection("versenyFeladatok").get(), db.collection("versenyPalyak").get()]).then(function (r) {
    var f = {}, v = {}, p = {};
    r[0].forEach(function (d) { var x = d.data(); if (x.alapId) (v[x.alapId] = v[x.alapId] || []).push(d.id); else f[d.id] = x; });
    r[1].forEach(function (d) { var x = d.data(); x.id = d.id; p[d.id] = x; });
    A.ft.feladatok = f; A.ft.valt = v; A.ft.palyak = p; A.ft.betoltve = true;
  });
}
function ftValtDb() { var n = 0; for (var k in A.ft.valt) n += A.ft.valt[k].length; return n; }
function ftFeladatNev(id) {
  var f = A.ft.feladatok[id];
  var m = /^([a-z]+)-(\d{4})-(\d+)-([A-Z]+)-(\d+)$/.exec(id || "");
  var rov = m ? m[2] + " " + m[4] + m[5] : (id || "–");
  return f && f.cim ? rov + " " + f.cim : rov;
}
function ftEredmeny(d) {
  var seg = d.segitseg ? (d.segitseg === 1 ? " (🔎 „Mit kérdeznek?”)" : " (" + (d.segitseg - 1) + ". lépésig)") : "";
  if (d.jo && !d.segitseg) return "✅ elsőre jó";
  if (d.jo) return "🙋 segítséggel jó" + seg;
  return '<span class="rossz-sz">❌ rossz: ' + esc(d.betu) + "</span>" + (d.csapda ? " — csapda: " + esc(d.csapda) : "") + (d.segitseg ? " · segítség volt" + seg : "");
}
function rajzFejtoro(t) {
  if (!A.ft.betoltve) {
    t.innerHTML = '<div class="ures">Betöltés…</div>';
    ftBetolt().then(function () { if (A.fulek === "fejtoro") rajzol(); }, function (e) {
      A.ft.betoltve = true; A.ft.uzenet = "⚠️ Nem sikerült betölteni (" + esc(e.code || e) + "). Publikálva vannak az új Firestore-szabályok?";
      if (A.fulek === "fejtoro") rajzol();
    });
    return;
  }
  var h = "<h2>🏔️ Fejtörő-hegy</h2>";
  /* feltöltés */
  var pl = Object.keys(A.ft.palyak).map(function (k) { return A.ft.palyak[k]; }).filter(function (p) { return p.liget !== "mesterproba"; }).sort(function (a, b) { return (a.sorrend || 0) - (b.sorrend || 0); });
  h += '<div class="kartya"><h3>Feladatok a felhőben</h3>' +
    '<div class="kicsi">' + Object.keys(A.ft.feladatok).length + " feladat · " + ftValtDb() + " számváltozat · " + pl.length + " pálya" +
    (pl.length ? ": " + pl.map(function (p) { return esc((p.ikon || "🏔️") + " " + p.nev) + " (" + (p.feladatok || []).length + " állomás)"; }).join(", ") : "") + "</div>" +
    '<p class="kicsi halvany" style="margin:8px 0">Új vagy javított tartalom: válaszd ki a <b>Matekos\\versenyfeladatok\\</b> mappából a JSON-fájlt (pl. <code>fejtoro-tesztpalya.json</code>, a számváltozatokhoz <code>fejtoro-valtozatok.json</code>). Az azonos azonosítójú feladat felülíródik, a többi marad. A változatok az eredeti feladat után tölthetők fel.</p>' +
    '<input type="file" id="ft-fajl" accept=".json,application/json"> <button id="ft-feltolt">⬆️ Feltöltés</button>' +
    (A.ft.uzenet ? '<div class="kicsi" style="margin-top:8px">' + A.ft.uzenet + "</div>" : "") + "</div>";
  /* válasz-napló */
  var evs = esemenyek({ type: "fejtoro_valasz" });
  h += "<h3>Válaszok az időszakban</h3>";
  if (!evs.length) h += '<div class="tabla-keret"><div class="ures">Még nincs Fejtörő-válasz az időszakban.</div></div>';
  else {
    var perJ = {};
    evs.forEach(function (e) {
      var s = perJ[e.uid] || (perJ[e.uid] = { db: 0, elsore: 0, seg: 0, rossz: 0 });
      s.db++; if (e.data.jo && !e.data.segitseg) s.elsore++; else if (e.data.jo) s.seg++; else s.rossz++;
    });
    h += '<div class="tabla-keret"><table><tr><th>Játékos</th><th class="szam">Válasz</th><th class="szam">✅ elsőre</th><th class="szam">🙋 segítséggel</th><th class="szam">❌ rossz</th></tr>' +
      Object.keys(perJ).map(function (uid) {
        var s = perJ[uid];
        return "<tr><td>" + esc(jNev(uid)) + '</td><td class="szam">' + s.db + '</td><td class="szam">' + s.elsore + '</td><td class="szam">' + s.seg + '</td><td class="szam">' + s.rossz + "</td></tr>";
      }).join("") + "</table></div>";
    h += '<div class="tabla-keret" style="margin-top:10px;max-height:520px;overflow:auto"><table><tr><th>Mikor</th><th>Játékos</th><th>Unikornis</th><th>Feladat</th><th>Eredmény</th><th>Betű</th><th class="szam">Gondolkodás</th><th></th></tr>' +
      evs.map(function (e) {
        var d = e.data;
        return "<tr><td>" + idoKi(e.ts) + "</td><td>" + esc(jNev(e.uid)) + "</td><td>" + esc(lenyNev(e.unicornId)) + "</td><td>" + esc(ftFeladatNev(d.feladatId)) +
          (d.valtozat ? '<br><span class="kicsi halvany">🔢 változat: ' + esc(d.szamok || d.valtozat) + "</span>" : "") +
          "</td><td>" + ftEredmeny(d) + "</td><td>" + esc(d.betu) + (d.jo ? "" : ' <span class="halvany">(jó: ' + esc(d.helyes) + ")</span>") +
          '</td><td class="szam">' + percKi(d.idoMp) + "</td><td>" + (d.vissza ? "🔁" : "") + "</td></tr>";
      }).join("") + "</table></div>";
  }
  /* visszatérő lista (a gyerek-mentésből) */
  var vl = [];
  A.users.forEach(function (u) {
    for (var k in u.unicorns) {
      var v = (u.unicorns[k].fejtoro || {}).vissza || {};
      for (var id in v) vl.push("<tr><td>" + esc(jNev(u.uid)) + "</td><td>" + esc(lenyNev(k)) + "</td><td>" + esc(ftFeladatNev(id)) + "</td><td>" + esc(v[id].nap) + '</td><td class="szam">' + (v[id].db || 1) + "</td></tr>");
    }
  });
  h += "<h3>🔁 Visszatérésre vár</h3>" + (vl.length
    ? '<div class="tabla-keret"><table><tr><th>Játékos</th><th>Unikornis</th><th>Feladat</th><th>Utoljára</th><th class="szam">Hányszor</th></tr>' + vl.join("") + "</table></div>" +
      '<p class="kicsi halvany" style="margin-top:6px">A feladat az „Utoljára” utáni első napon jön vissza, a pálya előtt („🔁 Emlékszel erre?”).</p>'
    : '<div class="tabla-keret"><div class="ures">Nincs visszatérő feladat.</div></div>');
  t.innerHTML = h;
  $("ft-feltolt").onclick = ftFeltolt;
}
function ftFeltolt() {
  var f = $("ft-fajl").files[0];
  if (!f) { A.ft.uzenet = "Előbb válassz ki egy JSON-fájlt."; rajzol(); return; }
  var r = new FileReader();
  r.onload = function () {
    var adat;
    try { adat = JSON.parse(r.result); } catch (e) { A.ft.uzenet = "⚠️ Ez nem érvényes JSON-fájl."; rajzol(); return; }
    if (adat && adat.formatum === "uc-fejtoro-valtozat-1" && adat.valtozatok) { ftValtFeltolt(adat.valtozatok); return; }
    if (!adat || adat.formatum !== "uc-fejtoro-1" || !Array.isArray(adat.feladatok)) { A.ft.uzenet = "⚠️ Ez nem Fejtörő-fájl (hiányzik: formatum „uc-fejtoro-1”)."; rajzol(); return; }
    var hibak = [];
    adat.feladatok.forEach(function (x) {
      if (!x.id || !x.szoveg || !x.valaszok || !x.helyes || !Array.isArray(x.lepesek)) hibak.push(x.id || "?");
    });
    if (hibak.length) { A.ft.uzenet = "⚠️ Hiányos feladat(ok): " + esc(hibak.join(", ")); rajzol(); return; }
    var batch = db.batch(), most = firebase.firestore.FieldValue.serverTimestamp();
    adat.feladatok.forEach(function (x) { var d = JSON.parse(JSON.stringify(x)); d.feltoltve = most; batch.set(db.collection("versenyFeladatok").doc(x.id), d); });
    (adat.palyak || []).forEach(function (x) { var d = JSON.parse(JSON.stringify(x)); d.feltoltve = most; batch.set(db.collection("versenyPalyak").doc(x.id), d); });
    A.ft.uzenet = "Feltöltés…"; rajzol();
    batch.commit().then(function () {
      A.ft.uzenet = "✅ Feltöltve: " + adat.feladatok.length + " feladat, " + (adat.palyak || []).length + " pálya. A gyerekeknél belépés után azonnal megjelenik.";
      return ftBetolt();
    }).then(rajzol, function (e) { A.ft.uzenet = "⚠️ Nem sikerült: " + esc(e.code || "") + " — " + esc(e.message || e); rajzol(); });
  };
  r.readAsText(f, "utf-8");
}
/* számváltozatok: { alapId:[{id, alapId, szamok, szoveg, valaszok, helyes, lepesek…}] } → versenyFeladatok/{id} */
function ftValtFeltolt(vo) {
  var irni = [], torolni = [], hibak = [], hianyzo = [];
  Object.keys(vo).forEach(function (alap) {
    if (!A.ft.feladatok[alap]) { hianyzo.push(alap); return; }
    var ujIdk = {};
    (vo[alap] || []).forEach(function (x) {
      if (!x.id || x.alapId !== alap || !x.szoveg || !x.valaszok || !x.helyes || !Array.isArray(x.lepesek)) hibak.push(x.id || "?");
      else { ujIdk[x.id] = 1; irni.push(x); }
    });
    (A.ft.valt[alap] || []).forEach(function (id) { if (!ujIdk[id]) torolni.push(id); });
  });
  if (hianyzo.length) { A.ft.uzenet = "⚠️ Előbb az eredeti feladatot töltsd fel: " + esc(hianyzo.join(", ")); rajzol(); return; }
  if (hibak.length) { A.ft.uzenet = "⚠️ Hiányos változat(ok): " + esc(hibak.join(", ")); rajzol(); return; }
  /* egy Firestore-köteg legfeljebb 500 művelet → darabolva */
  var muv = irni.map(function (x) { return { set: x }; }).concat(torolni.map(function (id) { return { del: id }; }));
  var most = firebase.firestore.FieldValue.serverTimestamp(), kotegek = [];
  for (var i = 0; i < muv.length; i += 400) kotegek.push(muv.slice(i, i + 400));
  A.ft.uzenet = "Feltöltés…"; rajzol();
  kotegek.reduce(function (pr, k) {
    return pr.then(function () {
      var batch = db.batch();
      k.forEach(function (m) {
        if (m.del) batch.delete(db.collection("versenyFeladatok").doc(m.del));
        else { var d = JSON.parse(JSON.stringify(m.set)); d.feltoltve = most; batch.set(db.collection("versenyFeladatok").doc(d.id), d); }
      });
      return batch.commit();
    });
  }, Promise.resolve()).then(function () {
    A.ft.uzenet = "✅ Feltöltve: " + irni.length + " számváltozat (" + Object.keys(vo).length + " feladathoz)" +
      (torolni.length ? ", " + torolni.length + " régi változat törölve" : "") + ". A gyerekeknél visszatérőnél és újrajátszásnál jelennek meg.";
    return ftBetolt();
  }).then(rajzol, function (e) { A.ft.uzenet = "⚠️ Nem sikerült: " + esc(e.code || "") + " — " + esc(e.message || e); rajzol(); });
}

})();
