<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teríték</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="fej">
    <div class="fej-bal"><a class="vissza" href="../index.html" title="Vissza a kaszinóba">🎰</a><h1>🃏 Teríték</h1></div>
    <div class="fej-jobb">
      <span class="cimke">Lapok:</span>
      <div id="meret-sor" class="meret-sor"></div>
    </div>
  </header>

  <main class="szinpad">
    <!-- ======================= A KASZINÓ-SZALON ======================= -->
    <div class="szoba">
      <!-- fali gázlámpák -->
      <div class="lampa lampa-bal">
        <svg viewBox="0 0 60 90" aria-hidden="true">
          <rect x="27" y="40" width="6" height="45" rx="3" fill="#7a5c28"/>
          <ellipse cx="30" cy="30" rx="16" ry="20" fill="#ffe9b0" opacity=".9"/>
          <ellipse cx="30" cy="30" rx="9" ry="13" fill="#fff6da"/>
          <path d="M14 30 a16 20 0 0 0 32 0" fill="none" stroke="#7a5c28" stroke-width="3"/>
        </svg>
      </div>
      <div class="lampa lampa-jobb">
        <svg viewBox="0 0 60 90" aria-hidden="true">
          <rect x="27" y="40" width="6" height="45" rx="3" fill="#7a5c28"/>
          <ellipse cx="30" cy="30" rx="16" ry="20" fill="#ffe9b0" opacity=".9"/>
          <ellipse cx="30" cy="30" rx="9" ry="13" fill="#fff6da"/>
          <path d="M14 30 a16 20 0 0 0 32 0" fill="none" stroke="#7a5c28" stroke-width="3"/>
        </svg>
      </div>

      <!-- ============ az asztaltársaság ============ -->
      <div class="tarsasag">

        <!-- bal játékos: RÓKA -->
        <div class="jatekos jatekos-bal">
          <svg viewBox="0 0 170 150" aria-hidden="true">
            <!-- fülek -->
            <path d="M38 38 L50 6 L68 32 Z" fill="#d97b29"/>
            <path d="M44 32 L52 14 L62 30 Z" fill="#8a4a12"/>
            <path d="M132 38 L120 6 L102 32 Z" fill="#d97b29"/>
            <path d="M126 32 L118 14 L108 30 Z" fill="#8a4a12"/>
            <!-- fej -->
            <ellipse cx="85" cy="62" rx="52" ry="42" fill="#e8862e"/>
            <path d="M45 72 Q85 108 125 72 Q108 92 85 92 Q62 92 45 72Z" fill="#fbe9d2"/>
            <!-- orr (mindig) -->
            <ellipse cx="85" cy="76" rx="7" ry="5" fill="#2b1c12"/>
            <!-- normál arc -->
            <g class="arc-normal">
              <ellipse cx="66" cy="58" rx="7" ry="9" fill="#2b1c12"/>
              <ellipse cx="104" cy="58" rx="7" ry="9" fill="#2b1c12"/>
              <circle cx="68" cy="55" r="2.4" fill="#fff"/>
              <circle cx="106" cy="55" r="2.4" fill="#fff"/>
              <path d="M74 84 Q85 92 96 84" fill="none" stroke="#2b1c12" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <!-- csalódott arc: morcos szemöldök, csukott szem, legörbülő száj, izzadságcsepp -->
            <g class="arc-csalodott">
              <path d="M56 50 L76 57" stroke="#2b1c12" stroke-width="3" stroke-linecap="round"/>
              <path d="M114 50 L94 57" stroke="#2b1c12" stroke-width="3" stroke-linecap="round"/>
              <path d="M60 63 Q66 68 73 63" fill="none" stroke="#2b1c12" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M97 63 Q104 68 110 63" fill="none" stroke="#2b1c12" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M74 90 Q85 81 96 90" fill="none" stroke="#2b1c12" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M129 42 q7 11 0 16 q-7 -5 0 -16" fill="#7ec8ff"/>
            </g>
            <!-- nevető arc: ^^ szemek, tátott száj nyelvvel -->
            <g class="arc-nevet">
              <path d="M58 60 Q66 51 74 60" fill="none" stroke="#2b1c12" stroke-width="3" stroke-linecap="round"/>
              <path d="M96 60 Q104 51 112 60" fill="none" stroke="#2b1c12" stroke-width="3" stroke-linecap="round"/>
              <path d="M72 84 Q85 101 98 84 Z" fill="#5c1f1f"/>
              <path d="M79 90 Q85 96 91 90 Z" fill="#e07a7a"/>
            </g>
            <!-- mancsok + lapok háttal -->
            <rect x="34" y="104" width="30" height="42" rx="4" fill="#3b5b9a" transform="rotate(-10 49 125)"/>
            <rect x="106" y="104" width="30" height="42" rx="4" fill="#3b5b9a" transform="rotate(10 121 125)"/>
            <rect x="39" y="109" width="20" height="32" rx="2" fill="none" stroke="#dce6f8" stroke-width="2" transform="rotate(-10 49 125)"/>
            <rect x="111" y="109" width="20" height="32" rx="2" fill="none" stroke="#dce6f8" stroke-width="2" transform="rotate(10 121 125)"/>
            <ellipse cx="62" cy="140" rx="12" ry="9" fill="#e8862e"/>
            <ellipse cx="108" cy="140" rx="12" ry="9" fill="#e8862e"/>
          </svg>
        </div>

        <!-- AZ OSZTÓ -->
        <div class="oszto-figura">
          <div id="buborek" class="buborek">
            <span class="buborek-cim">Az osztó mondja:</span>
            <b id="cel-szam">–</b>
          </div>
          <svg viewBox="0 0 220 210" aria-hidden="true">
            <!-- karok az asztal felé -->
            <path d="M52 150 Q30 190 12 202" fill="none" stroke="#1d2430" stroke-width="16" stroke-linecap="round"/>
            <path d="M168 150 Q190 190 208 202" fill="none" stroke="#1d2430" stroke-width="16" stroke-linecap="round"/>
            <circle cx="12" cy="203" r="9" fill="#f2c9a0"/>
            <circle cx="208" cy="203" r="9" fill="#f2c9a0"/>
            <!-- törzs: frakk + mellény -->
            <path d="M60 210 Q60 128 110 122 Q160 128 160 210 Z" fill="#1d2430"/>
            <path d="M88 210 Q88 140 110 132 Q132 140 132 210 Z" fill="#faf6ec"/>
            <path d="M96 210 Q96 150 110 142 Q124 150 124 210 Z" fill="#6d1f2c"/>
            <circle cx="110" cy="158" r="2.6" fill="#e8c96a"/>
            <circle cx="110" cy="172" r="2.6" fill="#e8c96a"/>
            <circle cx="110" cy="186" r="2.6" fill="#e8c96a"/>
            <!-- csokornyakkendő -->
            <path d="M110 134 L94 126 L94 142 Z" fill="#a01d2e"/>
            <path d="M110 134 L126 126 L126 142 Z" fill="#a01d2e"/>
            <circle cx="110" cy="134" r="4" fill="#7c1622"/>
            <!-- fej -->
            <ellipse cx="110" cy="86" rx="38" ry="40" fill="#f2c9a0"/>
            <!-- haj -->
            <path d="M72 80 Q72 40 110 40 Q148 40 148 80 Q148 58 110 56 Q72 58 72 80Z" fill="#2b2118"/>
            <!-- szemek + monokli (Verne-kor!) -->
            <ellipse cx="96" cy="84" rx="5" ry="6.5" fill="#2b1c12"/>
            <ellipse cx="124" cy="84" rx="5" ry="6.5" fill="#2b1c12"/>
            <circle cx="97.5" cy="82" r="1.8" fill="#fff"/>
            <circle cx="125.5" cy="82" r="1.8" fill="#fff"/>
            <circle cx="124" cy="85" r="11" fill="none" stroke="#e8c96a" stroke-width="2.4"/>
            <path d="M133 93 Q140 108 136 118" fill="none" stroke="#e8c96a" stroke-width="1.6"/>
            <!-- bajusz + mosoly -->
            <path d="M92 103 Q101 97 110 103 Q119 97 128 103 Q120 110 110 106 Q100 110 92 103Z" fill="#2b2118"/>
            <path d="M100 112 Q110 118 120 112" fill="none" stroke="#2b1c12" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- jobb játékos: BAGOLY -->
        <div class="jatekos jatekos-jobb">
          <svg viewBox="0 0 170 150" aria-hidden="true">
            <!-- fültollak -->
            <path d="M42 30 L34 6 L60 20 Z" fill="#7a5636"/>
            <path d="M128 30 L136 6 L110 20 Z" fill="#7a5636"/>
            <!-- fej-test -->
            <ellipse cx="85" cy="70" rx="55" ry="52" fill="#9a7248"/>
            <path d="M45 82 Q85 116 125 82 L125 108 Q85 132 45 108 Z" fill="#c9a87c"/>
            <!-- szemek (fehérje mindig) -->
            <circle cx="64" cy="60" r="17" fill="#fbf3e2"/>
            <circle cx="106" cy="60" r="17" fill="#fbf3e2"/>
            <!-- normál arc -->
            <g class="arc-normal">
              <circle cx="64" cy="62" r="8" fill="#2b1c12"/>
              <circle cx="106" cy="62" r="8" fill="#2b1c12"/>
              <circle cx="66.5" cy="59" r="2.6" fill="#fff"/>
              <circle cx="108.5" cy="59" r="2.6" fill="#fff"/>
            </g>
            <!-- csalódott arc: félig lecsukott szemhéj, lefelé néző pupilla, legörbülő "száj" -->
            <g class="arc-csalodott">
              <circle cx="62" cy="66" r="7" fill="#2b1c12"/>
              <circle cx="104" cy="66" r="7" fill="#2b1c12"/>
              <path d="M47 57 a17 17 0 0 1 34 0 Z" fill="#9a7248"/>
              <path d="M89 57 a17 17 0 0 1 34 0 Z" fill="#9a7248"/>
              <path d="M48 54 L79 59" stroke="#7a5636" stroke-width="3" stroke-linecap="round"/>
              <path d="M122 54 L91 59" stroke="#7a5636" stroke-width="3" stroke-linecap="round"/>
              <path d="M73 98 Q85 90 97 98" fill="none" stroke="#7a5636" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M136 40 q7 11 0 16 q-7 -5 0 -16" fill="#7ec8ff"/>
            </g>
            <!-- nevető arc: ^^ szemek, hátravetett fej-érzés -->
            <g class="arc-nevet">
              <path d="M50 62 Q64 50 78 62" fill="none" stroke="#2b1c12" stroke-width="3.4" stroke-linecap="round"/>
              <path d="M92 62 Q106 50 120 62" fill="none" stroke="#2b1c12" stroke-width="3.4" stroke-linecap="round"/>
              <path d="M76 86 Q85 100 94 86 Z" fill="#5c1f1f"/>
            </g>
            <!-- csőr -->
            <path d="M85 70 L77 82 Q85 90 93 82 Z" fill="#e8a13a"/>
            <!-- szárnyak + lapok háttal -->
            <rect x="30" y="102" width="30" height="42" rx="4" fill="#3b5b9a" transform="rotate(-12 45 123)"/>
            <rect x="110" y="102" width="30" height="42" rx="4" fill="#3b5b9a" transform="rotate(12 125 123)"/>
            <rect x="35" y="107" width="20" height="32" rx="2" fill="none" stroke="#dce6f8" stroke-width="2" transform="rotate(-12 45 123)"/>
            <rect x="115" y="107" width="20" height="32" rx="2" fill="none" stroke="#dce6f8" stroke-width="2" transform="rotate(12 125 123)"/>
            <ellipse cx="56" cy="138" rx="13" ry="9" fill="#7a5636"/>
            <ellipse cx="114" cy="138" rx="13" ry="9" fill="#7a5636"/>
          </svg>
        </div>
      </div>

      <!-- státusz-sor zseton-stílusban -->
      <div class="statusz">
        <span class="zseton zseton-ido">⏱ <b id="ora">1:30</b></span>
        <span class="zseton">Párok: <b id="pont">0</b></span>
        <span class="zseton zseton-rekord" id="rekord"></span>
      </div>

      <!-- ============ az asztal (posztó) ============ -->
      <div class="posztokeret">
        <div id="poszto" class="poszto"></div>
      </div>
    </div>
  </main>

  <div id="uzenet" class="uzenet"></div>

  <footer class="lab">
    <button id="btn-uj" class="btn">✨ Új kör</button>
  </footer>

  <div id="vege" class="vege rejtett">
    <div class="vege-lap">
      <div class="vege-emoji">🏆</div>
      <h2>Kör vége!</h2>
      <p id="vege-szoveg"></p>
      <button id="btn-ujra" class="btn btn-nagy">Új kör</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
